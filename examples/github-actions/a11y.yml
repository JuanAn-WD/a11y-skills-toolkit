# Example workflow: run the Playwright + axe accessibility regression test on every PR.
# Copy to .github/workflows/a11y.yml in your project and adjust the build/start commands,
# the port and the wait URL. Assumes tests/a11y.spec.ts (from a11y-reference/assets/tests)
# and devDependencies @playwright/test + @axe-core/playwright.
name: a11y

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      A11Y_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start app
        run: |
          npm run start -- --port 3000 > server.log 2>&1 &
          npx --yes wait-on --timeout 90000 "$A11Y_BASE_URL"
      - name: Accessibility regression test
        run: npx playwright test tests/a11y.spec.ts
      # Optional: authenticated routes. Store test credentials as repository secrets
      # and create a storageState in a Playwright setup project; never commit it.
      #   env:
      #     A11Y_USER: ${{ secrets.A11Y_USER }}
      #     A11Y_PASS: ${{ secrets.A11Y_PASS }}
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            server.log
